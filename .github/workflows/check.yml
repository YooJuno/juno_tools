name: Check system monitor
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: sudo apt-get update && sudo apt-get install -y gjs libglib2.0-bin gnome-shell
      - run: npm test
      - run: glib-compile-schemas --strict gnome-system-monitor/schemas
      - run: gjs -m tests/collector-smoke.js
      - run: gjs -m tests/monitor-regression.js
      - run: gjs -m tests/nvidia-regression.js
      - run: bash -n gnome-system-monitor/install.sh gnome-system-monitor/pack.sh
      - run: bash tests/installer-smoke.sh
      - run: bash gnome-system-monitor/pack.sh
      - uses: actions/upload-artifact@v4
        with:
          name: juno-system-monitor
          path: dist/*.shell-extension.zip
